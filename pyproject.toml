[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "messy-team"
version = "0.1.0"
description = "A messenger-style terminal app where coding agents live in sessions, DMs and group chats."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Zhussup" }]
dependencies = [
  "textual>=1.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
messy_team = "messy_team.__main__:main"

[tool.setuptools]
packages = ["messy_team", "messy_team.ui"]
